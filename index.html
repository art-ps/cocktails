<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Визуальные рецепты коктейлей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <script defer src="https://stats.pisarev.me/script.js" data-website-id="eacb5977-74c5-4db9-a863-01cc5577d34c"></script>
</head>
<body>
  <div id="bg"></div>
  <div id="app"></div>
  <canvas id="frameCanvas"></canvas>

  <!-- Экран выбора коктейля -->
  <div id="menu">
    <header class="menu-header">
      <h1>Визуальный бар</h1>
      <p>Выберите коктейль — и приготовьте его, просто листая страницу</p>
      <button id="styleBtn" title="Переключить стиль отображения"></button>
    </header>
    <div id="cards"></div>
    <footer class="menu-footer">
      <p>запущен на <a href="https://vibecoded.ru">vibecoded.ru</a></p>
    </footer>
  </div>

  <!-- Интерфейс поверх сцены -->
  <div id="hud" hidden>
    <button id="backBtn" title="К выбору коктейля">← Все коктейли</button>
    <div id="drinkTitle"></div>
    <div id="steps"></div>
    <div id="pourLabel">
      <div id="pourName"></div>
      <div id="pourAmount"><span id="pourMl">0</span><span class="unit"> мл</span></div>
    </div>
    <div id="frameLoad" hidden>Загрузка кадров… <span id="frameLoadPct">0</span>%</div>
    <div id="scrollHint">
      <span>Листайте вниз</span>
      <div class="arrow"></div>
    </div>
    <div id="finale">
      <div class="finale-inner">
        <div class="finale-kicker">Готово</div>
        <h2 id="finaleName"></h2>
        <p id="finaleRecipe"></p>
        <button id="againBtn">Выбрать другой коктейль</button>
      </div>
    </div>
  </div>

  <div id="spacer"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
